name: Daily KOSPI/KOSDAQ Pre-Market Strategy

on:
  schedule:
    # 한국 시간(KST) 평일(월~금) 07:30 실행 (UTC 기준 일~목 22:30)
    - cron: '30 22 * * 0-4'
  
  # 깃허브 웹 화면에서 버튼 눌러서 즉시 수동 테스트할 수 있게 해주는 옵션
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1. 내 깃허브 저장소의 코드(main.py, prompt.txt)를 임시 Ubuntu로 내려받기
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 파이썬 3.11 환경 셋업
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 필수 라이브러리 설치 (Gemini SDK + 공휴일 계산기)
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai markdown holidays

      # 4. 한국 공휴일(대체공휴일 포함) 체크 단계
      - name: Check Korean Public Holiday
        id: holiday_checker
        run: |
          python -c "
          import holidays, sys
          from datetime import datetime
          import zoneinfo

          # 한국 시간대(Asia/Seoul) 기준 오늘 날짜 계산
          kst = zoneinfo.ZoneInfo('Asia/Seoul')
          today = datetime.now(kst).date()
          kr_holidays = holidays.KR()

          # 오늘이 공휴일 목록에 있는지 검사
          if today in kr_holidays:
              holiday_name = kr_holidays.get(today)
              print(f'오늘은 대한민국 공휴일({holiday_name})입니다. 증시 휴장일이므로 스킵합니다.')
              with open(sys.argv[1], 'a') as f:
                  f.write('is_holiday=true\n')
          else:
              print(f'오늘은 정상 개장일({today})입니다. 리포트를 생성합니다.')
              with open(sys.argv[1], 'a') as f:
                  f.write('is_holiday=false\n')
          " "$GITHUB_OUTPUT"

      # 5. 리포트 생성 스크립트 실행 (공휴일이 아닐 때만 실행!)
      - name: Run Market Generator Script
        if: steps.holiday_checker.outputs.is_holiday == 'false'
        env:
          # 아까 깃허브에 등록한 비밀키를 환경변수로 주입
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 6. 생성된 대시보드 HTML 파일을 다운로드 가능한 결과물(Artifact)로 보관
      - name: Save HTML Dashboard Artifact
        if: steps.holiday_checker.outputs.is_holiday == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: market-dashboard-html
          path: dashboard_*.html
          retention-days: 7  # 7일간 보관 후 자동 삭제