name: Daily KOSPI/KOSDAQ Pre-Market Strategy

on:
  schedule:
    # 한국 시간(KST) 평일(월~금) 07:30 실행 (UTC 기준 일~목 22:30)
    - cron: '30 22 * * 0-4'
  workflow_dispatch:

# GitHub Pages 배포를 위한 필수 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-run:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai holidays

      - name: Check Korean Public Holiday
        id: holiday_checker
        run: |
          python -c "
          import holidays, sys
          from datetime import datetime
          import zoneinfo

          kst = zoneinfo.ZoneInfo('Asia/Seoul')
          today = datetime.now(kst).date()
          kr_holidays = holidays.KR()

          if today in kr_holidays:
              holiday_name = kr_holidays.get(today)
              print(f'오늘은 대한민국 공휴일({holiday_name})입니다. 증시 휴장일이므로 스킵합니다.')
              with open(sys.argv[1], 'a') as f:
                  f.write('is_holiday=true\n')
          else:
              print(f'오늘은 정상 개장일({today})입니다. 리포트를 생성합니다.')
              with open(sys.argv[1], 'a') as f:
                  f.write('is_holiday=false\n')
          " "$GITHUB_OUTPUT"

      # 리포트 생성 스크립트 실행
      - name: Run Market Generator Script
        if: steps.holiday_checker.outputs.is_holiday == 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      # 생성된 최신 리포트를 index.html로 준비 (웹사이트 대문 페이지)
      - name: Prepare Website Files
        if: steps.holiday_checker.outputs.is_holiday == 'false'
        run: |
          mkdir -p ./public
          # 가장 최근 생성된 대시보드 html을 index.html로 복사
          latest_report=$(ls -t dashboard_*.html | head -n 1)
          cp "$latest_report" ./public/index.html
          echo "웹 대문으로 복사 완료: $latest_report -> ./public/index.html"

      # GitHub Pages 배포 아티팩트 업로드
      - name: Upload Pages Artifact
        if: steps.holiday_checker.outputs.is_holiday == 'false'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      # GitHub Pages에 웹사이트 실제 배포
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.holiday_checker.outputs.is_holiday == 'false'
        uses: actions/deploy-pages@v4